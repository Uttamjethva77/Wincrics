version: '3.8'

services:
  react:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    networks:
      - wincrics_networkk

  nginx:
    image: nginx:latest
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./certs:/etc/nginx/certs
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - react
    networks:
      - wincrics_networkk

  certbot:
    image: certbot/certbot
    volumes:
      - ./certs:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - wincrics_networkk

networks:
  wincrics_networkk:
    driver: bridge
